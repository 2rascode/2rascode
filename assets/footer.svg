<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="2" fill="#000" opacity="0.28"/>
</pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="1.6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="vig" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
</radialGradient>
</defs>
<style>
text { font-family: 'Courier New', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; fill: #4fd65a; font-weight: 700; }
.hi { fill: #8dff8a; } .dim { fill: #1c4a22; } .sm { font-size: 12px; } .md { font-size: 14px; } .lg { font-size: 17px; letter-spacing: 2px; }
.crt { animation: flick 6s infinite; }
@keyframes flick { 0%,100% {opacity:1} 92% {opacity:1} 93% {opacity:.72} 94% {opacity:1} 97% {opacity:.86} 98% {opacity:1} }
.px { opacity: 0; animation: on .06s steps(1) forwards; animation-delay: 0s; }
@keyframes on { to { opacity: 1; } }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.type { animation: type 2.4s steps(20) forwards; }
@keyframes type { from { width: 0; } to { width: 200px; } }
.roll { animation: roll 7s linear infinite; }
@keyframes roll { from { transform: translateY(-40px); } to { transform: translateY(340px); } }

.drip { animation: drip 4s ease-in-out infinite; }
@keyframes drip { 0%,100% { opacity: .9; } 50% { opacity: .35; } }
</style>
